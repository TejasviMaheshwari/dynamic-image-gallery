<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gallery</title>
    <style>
        .con{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .box{
            height: 100%;
            width: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2px;
        }
        img{
            width: 100%;
        }
        h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Dynamic Gallery</h1>
    <div class="con">
        <div class="box">
            <img src="Night View.png" alt="">
            <img src="Mountain.png" alt="">
            <img src="Ocean.png" alt="">
            <img src="Beach.png" alt="">
        </div>
        <div class="box">
            <img src="Sky.png" alt="">
            <img src="Mountain.png" alt="">
            <img src="Beach.png" alt="">
            <img src="Camp.png" alt="">
        </div>
        <div class="box">
            <img src="Ocean.png" alt="">
            <img src="Night View.png" alt="">
            <img src="Mountain.png" alt="">
            <img src="Beach.png" alt="">
        </div>
        <div class="box">
            <img src="Camp.png" alt="">
            <img src="Sky.png" alt="">
            <img src="Mountain.png" alt="">
            <img src="Beach.png" alt=""> 
        </div>
        <div class="box">
            <img src="Beach.png" alt=""> 
            <img src="Ocean.png" alt="">
            <img src="Mountain.png" alt="">
            <img src="Night View.png" alt="">
        </div>
    </div>
</body>
</html>
